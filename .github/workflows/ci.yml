name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy backend apps
      - run: uv run pytest
      - run: uv run python scripts/check_openapi.py
  web:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package.json}
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: curl --fail --retry 12 --retry-connrefused http://localhost:8080/api/v1/health/ready
      - run: curl --fail http://localhost:8080/
      - if: always()
        run: docker compose down -v
