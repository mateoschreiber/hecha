name: hecha
services:
  proxy:
    image: caddy:2.10.0-alpine
    ports: ["8080:80"]
    volumes: ["./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    networks: [public, internal]
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment: ["API_INTERNAL_URL=http://api:8000"]
    depends_on: {api: {condition: service_healthy}}
    networks: [internal]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: ["DATABASE_URL=postgresql+psycopg://hecha@db:5432/hecha"]
    depends_on: {db: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
    networks: [internal]
    restart: unless-stopped
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"], interval: 10s, timeout: 3s, retries: 5}
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "apps.worker.main", "--forever"]
    environment: ["DATABASE_URL=postgresql+psycopg://hecha@db:5432/hecha"]
    depends_on: {db: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
    networks: [internal, egress]
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["alembic", "upgrade", "head"]
    environment: ["DATABASE_URL=postgresql+psycopg://hecha@db:5432/hecha"]
    depends_on: {db: {condition: service_healthy}}
    networks: [internal]
  db:
    image: postgres:18.0-alpine
    environment: ["POSTGRES_DB=hecha", "POSTGRES_USER=hecha", "POSTGRES_HOST_AUTH_METHOD=trust"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    networks: [internal]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hecha -d hecha"], interval: 5s, timeout: 3s, retries: 12}
volumes: {postgres-data: {}}
networks: {public: {}, internal: {internal: true}, egress: {}}
