[project]
name = "hecha"
version = "0.1.0"
description = "Portal de eficiencia legislativa paraguaya"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1.0", "httpx>=0.28,<1.0", "pydantic-settings>=2.7,<3.0", "psycopg[binary]>=3.2,<4.0", "redis>=5.2,<6.0", "sqlalchemy>=2.0,<3.0", "uvicorn[standard]>=0.34,<1.0"]

[dependency-groups]
dev = ["alembic>=1.14,<2.0", "mypy>=1.14,<2.0", "pytest>=8.3,<9.0", "pytest-cov>=6.0,<7.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["apps*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.13"
strict = true
packages = ["apps", "backend"]
